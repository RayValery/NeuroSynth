[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosynth"
version = "1.0.0"
description = "Does diffusion-generated EEG beat signal augmentation for few-shot motor-imagery BCI calibration?"
authors = [{ name = "Valerie Salivon" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "mne>=1.6",
    "mlflow>=2.10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
cloud = ["modal>=1.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
